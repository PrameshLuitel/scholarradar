name: Daily Supabase Scraper

on:
  schedule:
    # Runs at 00:00 UTC every day.
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allows manual trigger from the Actions tab in GitHub

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    
    # Prevent concurrent runs of the scraper
    concurrency:
      group: daily-scraper
      cancel-in-progress: false

    # GitHub Actions free tier allows up to 6 hours run time per job, which should be perfectly enough.
    timeout-minutes: 360

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🌐 Run Scraper
        env:
          # These must be set in GitHub repository settings -> Secrets and variables -> Actions
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }} # Optional
        run: |
          # Set the PYTHONPATH so the src modules are properly found
          export PYTHONPATH=$(pwd)
          python scripts/run_github_scrape.py
